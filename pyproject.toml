[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-oidc-common"
version = "0.1.0"
description = "Keycloak OIDC plumbing for Django apps: login session tracking, logout and back-channel logout."
readme = "README.md"
requires-python = ">=3.12"
# Ranges, not pins - each consuming app pins exact versions in its own
# requirements.txt.
dependencies = [
    "Django>=5.2,<6",
    "mozilla-django-oidc>=5.0,<6",
    "PyJWT[crypto]>=2.12,<3",
    "requests>=2.33,<3",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Without this the template isn't shipped in the wheel and /logged-out/ 500s.
oidc_common = ["templates/oidc_common/*.html"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Generated by makemigrations - not worth hand-editing to satisfy lint rules.
extend-exclude = ["src/oidc_common/migrations"]
