name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" ruff
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations match models
        run: DJANGO_SETTINGS_MODULE=tests.settings python -m django makemigrations --check --dry-run oidc_common
      - run: pytest

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Wheel ships the template
        run: python -m zipfile -l dist/*.whl | grep -q 'oidc_common/templates/oidc_common/logged_out.html'
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
